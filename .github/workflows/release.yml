name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib

          with open('custom_components/paysmarti_visitor/manifest.json', encoding='utf-8') as stream:
              manifest_version = json.load(stream)['version']
          with open('pyproject.toml', 'rb') as stream:
              package_version = tomllib.load(stream)['project']['version']
          tag = os.environ['GITHUB_REF_NAME']
          if tag != manifest_version or tag != package_version:
              raise SystemExit(f'Tag {tag} must match manifest and package versions')
          PY
      - name: Test Python integration
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q
      - name: Test dashboard card
        run: |
          npm ci
          npm test
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
