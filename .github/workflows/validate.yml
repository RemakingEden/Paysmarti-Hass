name: Validate
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: python -m pytest -q
      - name: Validate manifests
        run: python -m json.tool hacs.json && python -m json.tool custom_components/paysmarti_visitor/manifest.json
